# Standalone GASP emitter — deliberately NOT part of arc's own crate, so the
# self-evolving agent's build/tests never depend on it. Built by
# scripts/gasp_shim.sh via --manifest-path into the main target/ dir.
[package]
name = "gasp-emit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned to a specific arcagent-state commit (v0.4.2 on main) rather than the
# floating `branch = "main"`. gasp-emit's Cargo.lock is intentionally NOT tracked
# (it was regenerated by every cargo run and broke evolve commits), so the pin
# MUST live in this manifest to keep the build deterministic. Verified to build.
arcagent-state = { git = "https://github.com/MKonovalov/arcagent-state", rev = "1d228aecde6f1a0093125a38e5600773c6353907" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[workspace]
