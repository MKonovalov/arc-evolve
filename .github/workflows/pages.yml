name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_site.py"
      - "journals/**"
      - "IDENTITY.md"
      - "DREAM.md"
      - "docs/**"
  workflow_dispatch:

# Only `contents: read` — the publish push to the PUBLIC target repo is done
# by peaceiris/actions-gh-pages using a PAT (secrets.PAGES_PAT), NOT the
# GITHUB_TOKEN, so no `pages:`/`id-token:` permissions are needed. (A private
# repo can't serve Pages on the free plan, hence the cross-repo publish.)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdbook
        run: |
          curl -fSL --retry 3 --retry-delay 5 \
            "https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/mdbook.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/mdbook.tar.gz
          rm /tmp/mdbook.tar.gz
          mdbook --version

      - name: Build journal site
        run: python3 scripts/build_site.py

      - name: Build docs
        run: mdbook build docs/

      # Private repo -> public Pages: push the built `site/` to a SEPARATE
      # public repo (MKonovalov/arc-journal) via PAT. That public repo
      # must have Pages enabled on its `gh-pages` branch (Settings -> Pages ->
      # Deploy from a branch -> gh-pages / root). Mirrors arcpedia's journal
      # deploy (peaceiris/actions-gh-pages@v4).
      - name: Deploy to public site repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # PAT must have `repo` scope on the PUBLIC target repo.
          # Stored as a GitHub secret in THIS (private) repo.
          personal_token: ${{ secrets.PAGES_PAT }}
          publish_dir: ./site
          external_repository: MKonovalov/arc-journal
          publish_branch: gh-pages
          commit_message: "deploy site: ${{ github.sha }}"
