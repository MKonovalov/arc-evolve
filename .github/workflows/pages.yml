name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_site.py"
      - "journals/**"
      - "IDENTITY.md"
      - "DREAM.md"
      - "docs/**"
  workflow_dispatch:

# Only `contents: read` — the publish push to the PUBLIC target repo is done
# by peaceiris/actions-gh-pages using GH_PAT (from BWS), NOT the
# GITHUB_TOKEN, so no `pages:`/`id-token:` permissions are needed. (A private
# repo can't serve Pages on the free plan, hence the cross-repo publish.)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pull GH_PAT (broad PAT) from BWS — already configured on this repo
      # for cargo deps; reuse it as the peaceiris publish token so no separate
      # PAGES_PAT secret is needed. The PAT must have `repo` scope on the
      # target (arc-journal); the broad ARCPEDIA_GITHUB_TOKEN does.
      - name: Pull secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_ARCPEDIA_GITHUB_TOKEN }} > GH_PAT

      - name: Install mdbook
        run: |
          curl -fSL --retry 3 --retry-delay 5 \
            "https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/mdbook.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/mdbook.tar.gz
          rm /tmp/mdbook.tar.gz
          mdbook --version

      - name: Build journal site
        run: python3 scripts/build_site.py

      - name: Build docs
        run: mdbook build docs/

      # Private repo -> public Pages: push the built `site/` to a DEDICATED
      # public repo (MKonovalov/arc-evolve-site) via PAT, so arc-evolve gets
      # its own clean custom domain (arc-evolve.arclumen.de) instead of sharing
      # the Pages site — and the custom domain — with arcpedia's journal. The
      # first run creates the gh-pages branch; enable Pages afterwards
      # (Settings -> Pages -> Deploy from a branch -> gh-pages / root).
      - name: Deploy to public site repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Reuse GH_PAT (broad PAT, pulled from BWS above) — must have repo
          # scope on the target MKonovalov/arc-evolve-site. No separate
          # PAGES_PAT secret.
          personal_token: ${{ env.GH_PAT }}
          # No destination_dir -> publish to repo ROOT, so the CNAME emitted by
          # build_site.py lands at gh-pages/CNAME (required for the domain).
          publish_dir: ./site
          external_repository: MKonovalov/arc-evolve-site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "deploy site: ${{ github.sha }}"
