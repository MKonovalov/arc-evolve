name: Social

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'  # every 4 hours, offset 2h from evolution
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write
  discussions: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- Pull all secrets from Bitwarden Secrets Manager (BWS project 090f09ae, eu) ---
      # ARCPEDIA_GITHUB_TOKEN has broad repo access (incl. private arcagent /
      # arcagent-state), so it doubles as GH_PAT/GH_TOKEN for both the checkout
      # and the cargo git-dep auth. EXA/FIRECRAWL/DASHBOARD key names below follow
      # the repo's SM_ convention — correct them if your BWS names differ.
      - name: Pull secrets from Bitwarden
        id: bws
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_ARCPEDIA_GITHUB_TOKEN }} > GH_PAT
            ${{ vars.SM_ANTHROPIC_API_KEY }} > ANTHROPIC_API_KEY
            ${{ vars.SM_EXA_API_KEY }} > EXA_API_KEY
            ${{ vars.SM_FIRECRAWL_API_KEY }} > FIRECRAWL_API_KEY
            ${{ vars.SM_MODEL }} > MODEL

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ env.GH_PAT }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ env.GH_PAT }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Authenticate cargo git dependencies (arcagent is private)
        env:
          GH_PAT: ${{ env.GH_PAT }}
        run: |
          # Cargo's built-in git client (libgit2) cannot use a token and falls
          # back to credential prompts. Force it to shell out to the system git
          # CLI (via cargo config file, not just an env var — env is unreliable
          # across cargo versions) and feed git a stored credential so the
          # private arcagent / arcagent-state git deps clone authenticated.
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          printf 'https://x-access-token:%s@github.com\n' "$GH_PAT" > ~/.git-credentials
          git config --global credential.helper store
          # Belt-and-suspenders: also rewrite the URL in case CLI mode is off.
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Build
        run: cargo build --quiet

      - name: Detect bot identity
        id: bot-info
        run: |
          SLUG="arc-evolve-bot"
          if [ -z "$SLUG" ]; then
            echo "::error::GitHub App slug is empty. Check that your GitHub App is configured correctly."
            exit 1
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "login=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "${{ steps.bot-info.outputs.login }}"
          git config user.email "${{ steps.bot-info.outputs.email }}"

      - name: Run social session
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          MODEL: ${{ env.MODEL }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ env.GH_PAT }}
          GH_PAT: ${{ env.GH_PAT }}
          BOT_LOGIN: ${{ steps.bot-info.outputs.login }}
          BOT_SLUG: ${{ steps.bot-info.outputs.slug }}
          EXA_API_KEY: ${{ env.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ env.FIRECRAWL_API_KEY }}
        run: |
          chmod +x scripts/social.sh
          ./scripts/social.sh
