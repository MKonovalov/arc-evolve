name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Authenticate cargo git fetches (private arcgent deps)
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_PAT:-}" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          # Locate the built binary robustly (cargo outputs under target/<triple>/release/).
          # Use find so any cargo-output-path variance doesn't break packaging.
          BINARY="$(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -name 'arc' 2>/dev/null | head -1)"
          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "Error: binary 'arc' not found under target/${{ matrix.target }}/release/"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || echo "(release dir missing)"
            exit 1
          fi
          echo "Found binary: $BINARY"
          TARBALL="arc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$TARBALL" -C "target/${{ matrix.target }}/release" arc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$TARBALL" > "${TARBALL}.sha256"
          else
            shasum -a 256 "$TARBALL" > "${TARBALL}.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinaryPath = "target/${{ matrix.target }}/release/arc.exe"
          if (!(Test-Path $BinaryPath)) {
            Write-Error "Binary not found at $BinaryPath"
            Get-ChildItem "target/${{ matrix.target }}/release/"
            exit 1
          }
          $Archive = "arc-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $Staging = New-Item -ItemType Directory -Path "staging" -Force
          Copy-Item $BinaryPath $Staging
          Compress-Archive -Path (Join-Path $Staging "arc.exe") -DestinationPath $Archive
          if (!(Test-Path $Archive) -or (Get-Item $Archive).Length -eq 0) {
            Write-Error "Failed to create archive $Archive"
            exit 1
          }
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
          [System.IO.File]::WriteAllText("${Archive}.sha256", "$Hash  $Archive`n")

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: arc-${{ matrix.target }}
          path: |
            arc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            arc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: arc-${{ matrix.target }}
          path: |
            arc-${{ github.ref_name }}-${{ matrix.target }}.zip
            arc-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # arc-evolve depends on private git crates (arcgent), so it is NOT published to
    # crates.io (Cargo.toml has `publish = false`). This job is kept standalone and
    # non-blocking: it documents intent and would only run if publishing is enabled.
    # The GitHub Release does NOT depend on it.
    continue-on-error: true
    if: false  # disabled: arc-evolve is not a crates.io crate
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la arc-*
          ARCHIVE_COUNT=$(ls arc-*.tar.gz arc-*.zip 2>/dev/null | wc -l)
          if [ "$ARCHIVE_COUNT" -eq 0 ]; then
            echo "Error: no release archives found"
            exit 1
          fi
          echo "Found $ARCHIVE_COUNT archive(s)"

      - name: Extract changelog
        id: changelog
        run: |
          BODY=$(./scripts/extract_changelog.sh ${{ github.ref_name }})
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            arc-*.tar.gz
            arc-*.tar.gz.sha256
            arc-*.zip
            arc-*.zip.sha256
