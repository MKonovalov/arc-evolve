[package]
name = "arc-agent"
version = "0.1.15"
edition = "2021"
description = "A coding agent that evolves itself. Born as 200 lines of Rust, growing up in public."
license = "MIT"
repository = "https://github.com/MKonovalov/arc-evolve"
homepage = "https://MKonovalov.github.io/arc-evolve"
documentation = "https://MKonovalov.github.io/arc-evolve/book/"
readme = "README.md"
keywords = ["agent", "cli", "coding-agent", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
arcagent = { version = "0.9", features = ["openapi"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustyline = "15"
async-trait = "0.1"
glob = "0.3"
regex = "1"
base64 = "0.22"
tokio-util = "0.7.18"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
